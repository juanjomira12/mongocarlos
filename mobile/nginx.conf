server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter Web es una sola pagina: cualquier ruta que no exista como
    # archivo debe devolver index.html para que el router de Flutter
    # se encargue de ella.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index nunca se cachea, para que un despliegue nuevo se vea
    # de inmediato sin tener que limpiar el navegador.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
